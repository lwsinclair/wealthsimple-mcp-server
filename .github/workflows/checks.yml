name: Checks
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v3
        with:
          node-version-file: .nvmrc
      - name: Install Dependencies
        run: yarn install
      - name: Check Types
        run: yarn check_types
      - name: Lint
        run: yarn lint
      - name: Test
        run: yarn test
